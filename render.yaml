services:
  - type: web
    name: kz-erp-api
    runtime: docker
    rootDir: apps/api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: kz_erp
      - key: CORS_ORIGIN
        sync: false
      - key: APP_VERSION
        value: 0.1.0
