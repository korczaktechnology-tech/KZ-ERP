services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - kz-erp-mongo:/data/db

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "10000:10000"
    environment:
      PORT: 10000
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: ERP
      CORS_ORIGIN: http://localhost:1420
      APP_VERSION: 0.1.3
      AUTH_SECRET: local-development-secret-change-me
      CORE_BOOTSTRAP_KEY: local-bootstrap-key-change-me

volumes:
  kz-erp-mongo:
