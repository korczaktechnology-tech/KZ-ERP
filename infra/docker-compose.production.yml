services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      PORT: 10000
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DB: ${MONGODB_DB:-ERP}
      AUTH_SECRET: ${AUTH_SECRET}
      CORE_BOOTSTRAP_KEY: ${CORE_BOOTSTRAP_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN}
      APP_VERSION: ${APP_VERSION:-0.1.3}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "10000:10000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:10000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    networks: [erp]

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "1"]
    environment:
      MONGO_INITDB_DATABASE: ERP
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [erp]

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks: [erp]

  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
    networks: [erp]

networks:
  erp:
    driver: bridge

volumes:
  mongo-data:
  prometheus-data:
  grafana-data:
