name: Fix updater build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Patch Rust updater compile errors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/desktop/src-tauri/src/lib.rs')
          s = p.read_text()
          old = 'const UPDATE_PUBLIC_KEY_B64: &str = option_env!("UPDATE_PUBLIC_KEY_B64").unwrap_or("");'
          new = 'const UPDATE_PUBLIC_KEY_B64: &str = match option_env!("UPDATE_PUBLIC_KEY_B64") { Some(value) => value, None => "" };'
          if old in s:
              s = s.replace(old, new, 1)
          old = 'run_privileged("/usr/bin/dpkg", &["--install", "--force-downgrade", &backup_path]).await'
          new = 'run_privileged("/usr/bin/dpkg", &["--install", "--force-downgrade", backup_path.to_string_lossy().as_ref()]).await'
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify desktop Rust compilation
        working-directory: apps/desktop/src-tauri
        run: cargo check
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-updater-build.yml
          git add apps/desktop/src-tauri/src/lib.rs apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/Cargo.lock
          git commit -m 'fix(desktop): repair updater Rust build errors'
          git push
      - name: Trigger CI for fixed commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run CI --ref main
