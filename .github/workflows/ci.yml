name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  api:
    name: API check, test and build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        working-directory: apps/api
        run: npm install --no-audit --no-fund --prefer-offline
      - name: Type check
        working-directory: apps/api
        run: npm run check
      - name: Unit tests
        working-directory: apps/api
        run: npm test
      - name: Production build
        working-directory: apps/api
        run: npm run build
  desktop:
    name: Desktop type check and build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund --prefer-offline
      - name: Type check and frontend build
        working-directory: apps/desktop
        run: npm run build
  tauri:
    name: Linux Tauri package validation
    runs-on: ubuntu-22.04
    needs: [desktop]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            xdg-utils
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund --prefer-offline
      - name: Generate icons
        working-directory: apps/desktop
        run: npm run tauri icon src-tauri/icons/icon.svg
      - name: Build .deb
        working-directory: apps/desktop
        env:
          VITE_API_URL: https://kz-erp.onrender.com
          VITE_UPDATE_API_URL: https://kz-erp.onrender.com
        run: npm run tauri build -- --bundles deb
      - name: Validate package
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(apps/desktop/src-tauri/target/release/bundle/deb/*.deb)
          test "${#packages[@]}" -eq 1
          dpkg-deb --info "${packages[0]}"
          dpkg-deb --contents "${packages[0]}" >/dev/null
  mongo-config:
    name: MongoDB configuration validation
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify MongoDB is the only application database configuration
        run: |
          set -euo pipefail
          if grep -RniE 'postgres|postgresql|PGHOST|PGPORT|PGDATABASE|PGUSER|PGPASSWORD' apps infra render.yaml docker-compose.yml; then
            echo "ERRO: configuração PostgreSQL detectada"; exit 1
          fi
          grep -Rni 'MONGODB_URI' apps/api infra render.yaml docker-compose.yml
  f2-mongo:
    name: F2 real MongoDB integration
    runs-on: ubuntu-22.04
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install API dependencies
        working-directory: apps/api
        run: npm install --no-audit --no-fund --prefer-offline
      - name: Run F2 Mongo smoke
        working-directory: apps/api
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/kz_erp_f2_smoke
        run: node --import tsx scripts/f2-mongo-smoke.mjs
  f2-e2e:
    name: F2 operational API smoke
    runs-on: ubuntu-22.04
    needs: [api]
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      KZ_ERP_API_URL: https://kz-erp.onrender.com
      KZ_ERP_E2E_EMAIL: ${{ secrets.KZ_ERP_E2E_EMAIL }}
      KZ_ERP_E2E_PASSWORD: ${{ secrets.KZ_ERP_E2E_PASSWORD }}
      KZ_ERP_E2E_COMPANY_SLUG: ${{ secrets.KZ_ERP_E2E_COMPANY_SLUG }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install API dependencies
        working-directory: apps/api
        run: npm install --no-audit --no-fund --prefer-offline
      - name: Use configured remote E2E credentials
        id: remote-creds
        shell: bash
        run: |
          if [[ -n "$KZ_ERP_E2E_EMAIL" && -n "$KZ_ERP_E2E_PASSWORD" ]]; then
            echo "mode=remote" >> "$GITHUB_OUTPUT"
          else
            echo "mode=local" >> "$GITHUB_OUTPUT"
          fi
      - name: Start isolated local API for E2E
        if: steps.remote-creds.outputs.mode == 'local'
        working-directory: apps/api
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/kz_erp_e2e
          MONGODB_DB: kz_erp_e2e
          AUTH_SECRET: kz-erp-e2e-auth-secret-2026-local-only-please-do-not-use
          CORE_BOOTSTRAP_KEY: kz-erp-e2e-bootstrap-key-2026-local-only
          CORS_ORIGIN: http://localhost:1420
          PORT: 10000
        run: |
          npm run build
          nohup npm start > /tmp/kz-erp-e2e-api.log 2>&1 &
          echo $! > /tmp/kz-erp-e2e-api.pid
      - name: Bootstrap isolated E2E tenant and credentials
        if: steps.remote-creds.outputs.mode == 'local'
        shell: bash
        env:
          KZ_ERP_API_URL: http://127.0.0.1:10000
          E2E_EMAIL: e2e@kz-erp.local
          E2E_PASSWORD: KzErp-E2E-2026-Local!
          E2E_COMPANY_SLUG: kz-erp-e2e
          CORE_BOOTSTRAP_KEY: kz-erp-e2e-bootstrap-key-2026-local-only
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl -fsS "$KZ_ERP_API_URL/health/ready" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS "$KZ_ERP_API_URL/health/ready" >/dev/null
          curl -fsS -X POST "$KZ_ERP_API_URL/api/v1/auth/bootstrap" \
            -H 'Content-Type: application/json' \
            --data "{\"companyName\":\"KZ ERP E2E\",\"slug\":\"$E2E_COMPANY_SLUG\",\"name\":\"E2E Runner\",\"email\":\"$E2E_EMAIL\",\"password\":\"$E2E_PASSWORD\",\"bootstrapKey\":\"$CORE_BOOTSTRAP_KEY\"}" >/dev/null
          {
            echo "KZ_ERP_API_URL=$KZ_ERP_API_URL"
            echo "KZ_ERP_E2E_EMAIL=$E2E_EMAIL"
            echo "KZ_ERP_E2E_PASSWORD=$E2E_PASSWORD"
            echo "KZ_ERP_E2E_COMPANY_SLUG=$E2E_COMPANY_SLUG"
          } >> "$GITHUB_ENV"
      - name: Run F2 operational smoke against remote
        if: steps.remote-creds.outputs.mode == 'remote'
        working-directory: apps/api
        run: node scripts/f2-full-smoke.mjs
      - name: Run F2 operational smoke against isolated local API
        if: steps.remote-creds.outputs.mode == 'local'
        working-directory: apps/api
        run: node scripts/f2-full-smoke.mjs
      - name: Dump local API log on failure
        if: failure() && steps.remote-creds.outputs.mode == 'local'
        run: cat /tmp/kz-erp-e2e-api.log || true
      - name: Stop isolated local API
        if: always() && steps.remote-creds.outputs.mode == 'local'
        run: kill "$(cat /tmp/kz-erp-e2e-api.pid)" 2>/dev/null || true
