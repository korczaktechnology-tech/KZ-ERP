name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  api:
    name: API check, test and build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        working-directory: apps/api
        run: npm install --no-audit --no-fund --prefer-offline
      - name: Type check
        working-directory: apps/api
        run: npm run check
      - name: Unit tests
        working-directory: apps/api
        run: npm test
      - name: Production build
        working-directory: apps/api
        run: npm run build
  desktop:
    name: Desktop type check and build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund --prefer-offline
      - name: Type check and frontend build
        working-directory: apps/desktop
        run: npm run build
  tauri:
    name: Linux Tauri package validation
    runs-on: ubuntu-22.04
    needs: [desktop]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            xdg-utils
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund --prefer-offline
      - name: Generate icons
        working-directory: apps/desktop
        run: npm run tauri icon src-tauri/icons/icon.svg
      - name: Build .deb
        working-directory: apps/desktop
        env:
          VITE_API_URL: https://kz-erp.onrender.com
          VITE_UPDATE_API_URL: https://kz-erp.onrender.com
        run: npm run tauri build -- --bundles deb
      - name: Validate package
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(apps/desktop/src-tauri/target/release/bundle/deb/*.deb)
          test "${#packages[@]}" -eq 1
          dpkg-deb --info "${packages[0]}"
          dpkg-deb --contents "${packages[0]}" >/dev/null
  mongo-config:
    name: MongoDB configuration validation
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify MongoDB is the only application database configuration
        run: |
          set -euo pipefail
          if grep -RniE 'postgres|postgresql|PGHOST|PGPORT|PGDATABASE|PGUSER|PGPASSWORD' apps infra render.yaml docker-compose.yml; then
            echo "ERRO: configuração PostgreSQL detectada"; exit 1
          fi
          grep -Rni 'MONGODB_URI' apps/api infra render.yaml docker-compose.yml
  f2-mongo:
    name: F2 real MongoDB integration
    runs-on: ubuntu-22.04
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install API dependencies
        working-directory: apps/api
        run: npm install --no-audit --no-fund --prefer-offline
      - name: Run F2 Mongo smoke
        working-directory: apps/api
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/kz_erp_f2_smoke
        run: node --import tsx scripts/f2-mongo-smoke.mjs
