name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  api:
    name: API check, test and build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package.json
      - name: Install dependencies
        working-directory: apps/api
        run: npm install --no-audit --no-fund --prefer-offline
      - name: Type check
        working-directory: apps/api
        run: npm run check
      - name: Unit tests
        working-directory: apps/api
        run: npm test
      - name: Production build
        working-directory: apps/api
        run: npm run build
  desktop:
    name: Desktop type check and build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package.json
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund --prefer-offline
      - name: Type check and frontend build
        working-directory: apps/desktop
        run: npm run build
  tauri:
    name: Linux Tauri package validation
    runs-on: ubuntu-22.04
    needs: [api, desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund --prefer-offline
      - name: Generate icons
        working-directory: apps/desktop
        run: npm run tauri icon src-tauri/icons/icon.svg
      - name: Build .deb
        working-directory: apps/desktop
        env:
          VITE_API_URL: https://kz-erp.onrender.com
          VITE_UPDATE_API_URL: https://kz-erp.onrender.com
        run: npm run tauri build -- --bundles deb
      - name: Validate package
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(apps/desktop/src-tauri/target/release/bundle/deb/*.deb)
          test "${#packages[@]}" -eq 1
          dpkg-deb --info "${packages[0]}"
          dpkg-deb --contents "${packages[0]}" >/dev/null
  postgres-schema:
    name: PostgreSQL schema integration validation
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: erp_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d erp_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Apply schema
        env:
          PGPASSWORD: ci_password
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d erp_ci -v ON_ERROR_STOP=1 -f db/postgresql/000_extensions.sql
          psql -h 127.0.0.1 -U postgres -d erp_ci -v ON_ERROR_STOP=1 -f db/postgresql/001_enterprise_core.sql
          psql -h 127.0.0.1 -U postgres -d erp_ci -v ON_ERROR_STOP=1 -f db/postgresql/002_audit_trigger_hardening.sql
          psql -h 127.0.0.1 -U postgres -d erp_ci -v ON_ERROR_STOP=1 -c "INSERT INTO erp.tenant(legal_name,trade_name,tax_id) VALUES ('CI Empresa','CI Empresa','CI-001') RETURNING id;"
          psql -h 127.0.0.1 -U postgres -d erp_ci -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_policies WHERE schemaname='erp';"
          psql -h 127.0.0.1 -U postgres -d erp_ci -v ON_ERROR_STOP=1 -c "SELECT extname FROM pg_extension WHERE extname IN ('pgcrypto','citext') ORDER BY extname;"
  infrastructure:
    name: Infrastructure validation
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform format check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive
      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init -backend=false -input=false
      - name: Terraform validate
        working-directory: infra/terraform
        run: terraform validate
