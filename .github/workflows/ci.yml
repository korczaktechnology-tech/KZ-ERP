name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    name: API validation
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package.json
      - name: Install API dependencies
        working-directory: apps/api
        run: npm install --no-audit --no-fund --prefer-offline
      - name: Typecheck API
        working-directory: apps/api
        run: npm run typecheck
      - name: Test API
        working-directory: apps/api
        run: npm test -- --runInBand
      - name: Build API
        working-directory: apps/api
        run: npm run build

  desktop:
    name: Desktop validation
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils openssl jq dpkg-dev curl
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund --prefer-offline
      - name: Typecheck desktop
        working-directory: apps/desktop
        run: npm run typecheck
      - name: Build desktop
        working-directory: apps/desktop
        env:
          VITE_APP_VERSION: 0.1.3
          VITE_API_URL: https://kz-erp.onrender.com
          VITE_UPDATE_API_URL: https://kz-erp.onrender.com
        run: npm run tauri build -- --bundles deb
      - name: Verify Debian package
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(apps/desktop/src-tauri/target/release/bundle/deb/*.deb)
          test "${#packages[@]}" -eq 1
          dpkg-deb --info "${packages[0]}"
          dpkg-deb --contents "${packages[0]}" >/dev/null

  mongo-config:
    name: MongoDB configuration validation
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify MongoDB is the only application database configuration
        run: |
          set -euo pipefail
          if grep -RniE 'postgres|postgresql|PGHOST|PGPORT|PGDATABASE|PGUSER|PGPASSWORD' apps infra render.yaml docker-compose.yml; then
            echo "ERRO: configuração PostgreSQL detectada"; exit 1
          fi
          grep -Rni 'MONGODB_URI' apps/api infra render.yaml docker-compose.yml
