name: F1 operational verification
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  operational:
    if: ${{ secrets.KZ_ERP_E2E_EMAIL != '' && secrets.KZ_ERP_E2E_PASSWORD != '' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install API dependencies
        working-directory: apps/api
        run: npm install --no-audit --no-fund --prefer-offline
      - name: Run authenticated F1 operational smoke
        working-directory: apps/api
        env:
          KZ_ERP_API_URL: ${{ secrets.KZ_ERP_API_URL || 'https://kz-erp.onrender.com' }}
          KZ_ERP_E2E_EMAIL: ${{ secrets.KZ_ERP_E2E_EMAIL }}
          KZ_ERP_E2E_PASSWORD: ${{ secrets.KZ_ERP_E2E_PASSWORD }}
          KZ_ERP_E2E_COMPANY_SLUG: ${{ secrets.KZ_ERP_E2E_COMPANY_SLUG }}
        run: npm run f1:smoke
