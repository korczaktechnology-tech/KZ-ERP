name: Release Linux

on:
  push:
    branches: [main]
    paths:
      - .github/release-trigger
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer version to build"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: release-linux
  cancel-in-progress: false

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Validate workflow environment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GITHUB_REPOSITORY"
          test -n "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY" --jq '.full_name'
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=1" --jq 'length'
          echo "Release workflow execution OK"
