name: Release Linux

on:
  push:
    branches: [main]
    paths:
      - .github/release-trigger
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer version to build (for example 0.1.3)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: linux-release
  cancel-in-progress: false

env:
  DEB_NAME: KORCZAK-ERP-linux-amd64.deb
  MAX_DEB_BYTES: 262144000
  UPDATE_API_BASE: https://kz-erp.onrender.com

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Lint GitHub Actions workflow
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
          ./actionlint .github/workflows/release.yml

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: linux-tauri-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'apps/desktop/src-tauri/Cargo.toml') }}
          restore-keys: |
            linux-tauri-${{ runner.os }}-

      - name: Install Linux dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils openssl jq dpkg-dev curl coreutils

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Determine release version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$DISPATCH_VERSION" ]; then
            VERSION="${DISPATCH_VERSION#v}"
          else
            BASE="$(node -p "require('./apps/desktop/package.json').version")"
            [[ "$BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "ERRO: versão base inválida"; exit 1; }
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
            COUNT="$(git rev-list --count "$GITHUB_SHA")"
            [ "$COUNT" -gt "$PATCH" ] || COUNT=$((PATCH + 1))
            VERSION="$MAJOR.$MINOR.$COUNT"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "ERRO: versão inválida: $VERSION"; exit 1; }
          TAG="v$VERSION"
          echo "BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_TAG=$TAG" >> "$GITHUB_ENV"
          EXISTING="$(timeout 30s gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name=="'"$TAG"'") | [.id,.draft] | @tsv')"
          if [ -n "$EXISTING" ]; then
            read -r EXISTING_ID EXISTING_DRAFT <<< "$(printf '%s\n' "$EXISTING" | sed -n '1p')"
            if [ "$EXISTING_DRAFT" = "true" ]; then
              timeout 30s gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$EXISTING_ID"
            else
              echo "ERRO: a release $TAG já está publicada."; exit 1
            fi
          fi
          if git ls-remote --exit-code --refs origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "ERRO: a tag $TAG já existe no repositório."; exit 1
          fi
          LATEST="$(timeout 30s gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft==false and .prerelease==false) | .tag_name' | sed -n 's/^v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p' | sort -V | tail -n1)"
          if [ -n "$LATEST" ]; then
            if ! node -e 'const a=process.argv[1].split(".").map(Number),b=process.argv[2].split(".").map(Number);for(let i=0;i<3;i++){if(a[i]>b[i])process.exit(0);if(a[i]<b[i])process.exit(1)}process.exit(1)' "$VERSION" "$LATEST"; then
              echo "ERRO: versão $VERSION não é superior à última release $LATEST"; exit 1
            fi
          fi

      - name: Set package version
        working-directory: apps/desktop
        env:
          VERSION: ${{ env.BUILD_VERSION }}
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs"),v=process.env.VERSION;for(const f of ["package.json","src-tauri/tauri.conf.json"]){const d=JSON.parse(fs.readFileSync(f,"utf8"));d.version=v;fs.writeFileSync(f,JSON.stringify(d,null,2)+"\n")}'
          node -e 'const fs=require("fs"),v=process.env.VERSION,p="src-tauri/Cargo.toml",t=fs.readFileSync(p,"utf8"),u=t.replace(/^version\s*=\s*"[^"]+"/m,"version = "+JSON.stringify(v));if(u===t)throw new Error("ERRO: não foi possível atualizar Cargo.toml");fs.writeFileSync(p,u)'
          [ "$(node -p "require('./package.json').version")" = "$VERSION" ]
          [ "$(node -p "require('./src-tauri/tauri.conf.json').version")" = "$VERSION" ]
          [ "$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -n1)" = "$VERSION" ]

      - name: Prepare update signing key
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          KEY_FILE="$(mktemp /tmp/kz-update-signing-key.XXXXXX.pem)"
          trap 'rm -f "$KEY_FILE"' EXIT
          [ -n "$UPDATE_SIGNING_PRIVATE_KEY" ] || { echo "ERRO: configure UPDATE_SIGNING_PRIVATE_KEY."; exit 1; }
          printf '%s' "$UPDATE_SIGNING_PRIVATE_KEY" > "$KEY_FILE"
          timeout 30s openssl pkey -in "$KEY_FILE" -pubout >/dev/null
          PUBLIC_KEY="$(timeout 30s openssl pkey -in "$KEY_FILE" -pubout -outform DER | tail -c 32 | base64 -w0)"
          [ "${#PUBLIC_KEY}" -eq 44 ] || { echo "ERRO: chave Ed25519 inválida."; exit 1; }
          echo "UPDATE_PUBLIC_KEY_B64=$PUBLIC_KEY" >> "$GITHUB_ENV"

      - name: Generate application icons
        working-directory: apps/desktop
        run: npm run tauri icon src-tauri/icons/icon.svg

      - name: Clean previous Debian bundles
        run: rm -rf apps/desktop/src-tauri/target/release/bundle/deb

      - name: Build Linux .deb
        working-directory: apps/desktop
        env:
          VITE_APP_VERSION: ${{ env.BUILD_VERSION }}
          VITE_API_URL: https://kz-erp.onrender.com
          VITE_UPDATE_API_URL: https://kz-erp.onrender.com
          VITE_UPDATE_PUBLIC_KEY_B64: ${{ env.UPDATE_PUBLIC_KEY_B64 }}
        run: npm run tauri build -- --bundles deb

      - name: Verify Debian package
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(apps/desktop/src-tauri/target/release/bundle/deb/*.deb)
          if [ "${#packages[@]}" -ne 1 ]; then echo "ERRO: esperado exatamente 1 .deb"; exit 1; fi
          PACKAGE="${packages[0]}"
          SIZE="$(stat -c '%s' "$PACKAGE")"
          if [ "$SIZE" -le 0 ] || [ "$SIZE" -gt "$MAX_DEB_BYTES" ]; then echo "ERRO: tamanho do .deb inválido: $SIZE"; exit 1; fi
          dpkg-deb --info "$PACKAGE"
          dpkg-deb --contents "$PACKAGE" >/dev/null
          [ "$(dpkg-deb -f "$PACKAGE" Version)" = "$BUILD_VERSION" ] || { echo "ERRO: versão do .deb incorreta"; exit 1; }
          [ "$(dpkg-deb -f "$PACKAGE" Architecture)" = "amd64" ] || { echo "ERRO: arquitetura do .deb incorreta"; exit 1; }

      - name: Prepare release files
        run: |
          set -euo pipefail
          rm -rf release-artifact && mkdir -p release-artifact
          cp apps/desktop/src-tauri/target/release/bundle/deb/*.deb "release-artifact/$DEB_NAME"
          sha256sum "release-artifact/$DEB_NAME" > release-artifact/SHA256SUMS.txt
          test -s "release-artifact/$DEB_NAME"
          test -s release-artifact/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: KORCZAK-ERP-linux-deb-${{ github.sha }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Create draft release and upload base assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${BUILD_VERSION}"
          RELEASE_JSON="$(timeout 30s gh api --method POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f name="KORCZAK ERP $TAG" -f body="Release oficial do KORCZAK ERP. Commit $GITHUB_SHA." -F draft=true -F prerelease=false)"
          RELEASE_ID="$(jq -r '.id' <<<"$RELEASE_JSON")"
          UPLOAD_URL="$(jq -r '.upload_url' <<<"$RELEASE_JSON" | sed 's/{?name,label}//')"
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]] || { echo "ERRO: release ID inválido"; exit 1; }
          [[ "$UPLOAD_URL" == https://uploads.github.com/repos/*/releases/*/assets ]] || { echo "ERRO: upload_url inválida"; exit 1; }
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          echo "RELEASE_UPLOAD_URL=$UPLOAD_URL" >> "$GITHUB_ENV"
          timeout 150s curl --fail-with-body --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 120 -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2026-03-10" -H "Content-Type: application/octet-stream" --data-binary @"release-artifact/$DEB_NAME" "$UPLOAD_URL?name=$DEB_NAME" >/dev/null
          timeout 90s curl --fail-with-body --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 60 -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2026-03-10" -H "Content-Type: text/plain" --data-binary @release-artifact/SHA256SUMS.txt "$UPLOAD_URL?name=SHA256SUMS.txt" >/dev/null

      - name: Create signed update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          KEY_FILE="$(mktemp /tmp/kz-update-signing-key.XXXXXX.pem)"
          SIG_FILE="$(mktemp /tmp/kz-update-signature.XXXXXX.bin)"
          trap 'rm -f "$KEY_FILE" "$SIG_FILE" release-artifact/update-signing-payload.txt' EXIT
          SHA256="$(cut -d' ' -f1 release-artifact/SHA256SUMS.txt | tr '[:upper:]' '[:lower:]')"
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "ERRO: SHA256 inválido"; exit 1; }
          ASSET_ID="$(timeout 30s gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" --jq '.[] | select(.name=="'"$DEB_NAME"'" and .state=="uploaded") | .id')"
          [[ "$ASSET_ID" =~ ^[0-9]+$ ]] || { echo "ERRO: assetId REST inválido"; exit 1; }
          printf '%s\n%s\n%s\n%s\n' "$BUILD_VERSION" "$ASSET_ID" "$SHA256" "$DEB_NAME" > release-artifact/update-signing-payload.txt
          [ -n "$UPDATE_SIGNING_PRIVATE_KEY" ] || { echo "ERRO: chave de assinatura ausente"; exit 1; }
          printf '%s' "$UPDATE_SIGNING_PRIVATE_KEY" > "$KEY_FILE"
          timeout 30s openssl pkeyutl -sign -rawin -inkey "$KEY_FILE" -in release-artifact/update-signing-payload.txt -out "$SIG_FILE"
          SIGNATURE="$(base64 -w0 "$SIG_FILE")"
          printf '{"version":"%s","assetId":%s,"assetName":"%s","sha256":"%s","signature":"%s"}\n' "$BUILD_VERSION" "$ASSET_ID" "$DEB_NAME" "$SHA256" "$SIGNATURE" > release-artifact/UPDATE-MANIFEST.json
          jq -e --arg v "$BUILD_VERSION" --arg n "$DEB_NAME" --argjson id "$ASSET_ID" '.version==$v and .assetId==$id and .assetName==$n and (.sha256|test("^[0-9a-f]{64}$")) and (.signature|length>0)' release-artifact/UPDATE-MANIFEST.json >/dev/null
          timeout 90s curl --fail-with-body --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 60 -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2026-03-10" -H "Content-Type: application/json" --data-binary @release-artifact/UPDATE-MANIFEST.json "$RELEASE_UPLOAD_URL?name=UPDATE-MANIFEST.json" >/dev/null

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PUBLISHED="$(timeout 30s gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -F make_latest=true)"
          [ "$(jq -r '.draft' <<<"$PUBLISHED")" = "false" ] || { echo "ERRO: release não foi publicada"; exit 1; }
          [ "$(jq -r '.tag_name' <<<"$PUBLISHED")" = "$BUILD_TAG" ] || { echo "ERRO: tag publicada incorreta"; exit 1; }
          [ "$(jq -r '.target_commitish' <<<"$PUBLISHED")" = "$GITHUB_SHA" ] || { echo "ERRO: commit publicado incorreto"; exit 1; }

      - name: End-to-end release/update smoke test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WORK_DIR="$(mktemp -d /tmp/kz-release-smoke.XXXXXX)"
          trap 'rm -rf "$WORK_DIR"' EXIT
          MANIFEST="$WORK_DIR/UPDATE-MANIFEST.json"
          DEB="$WORK_DIR/$DEB_NAME"
          API_MANIFEST="$WORK_DIR/api-manifest.json"
          API_DEB="$WORK_DIR/api-$DEB_NAME"
          RELEASE="$(timeout 30s gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          [ "$(jq -r '.draft' <<<"$RELEASE")" = "false" ] || { echo "ERRO: release ainda draft"; exit 1; }
          [ "$(jq -r '.tag_name' <<<"$RELEASE")" = "$BUILD_TAG" ] || { echo "ERRO: tag diverge"; exit 1; }
          MANIFEST_ID="$(jq -r '.assets[] | select(.name=="UPDATE-MANIFEST.json" and .state=="uploaded") | .id' <<<"$RELEASE")"
          DEB_ID="$(jq -r --arg n "$DEB_NAME" '.assets[] | select(.name==$n and .state=="uploaded") | .id' <<<"$RELEASE")"
          if ! [[ "$MANIFEST_ID" =~ ^[0-9]+$ ]] || ! [[ "$DEB_ID" =~ ^[0-9]+$ ]]; then echo "ERRO: asset IDs inválidos"; exit 1; fi
          timeout 60s gh api "repos/$GITHUB_REPOSITORY/releases/assets/$MANIFEST_ID" -H "Accept: application/octet-stream" > "$MANIFEST"
          timeout 150s gh api "repos/$GITHUB_REPOSITORY/releases/assets/$DEB_ID" -H "Accept: application/octet-stream" > "$DEB"
          if [ ! -s "$MANIFEST" ] || [ ! -s "$DEB" ]; then echo "ERRO: asset baixado vazio"; exit 1; fi
          jq -e --arg v "$BUILD_VERSION" --arg n "$DEB_NAME" --argjson id "$DEB_ID" '.version==$v and .assetName==$n and .assetId==$id and (.sha256|test("^[0-9a-fA-F]{64}$")) and (.signature|length>0)' "$MANIFEST" >/dev/null
          ACTUAL_SHA="$(sha256sum "$DEB" | cut -d' ' -f1 | tr '[:upper:]' '[:lower:]')"
          EXPECTED_SHA="$(jq -r '.sha256' "$MANIFEST" | tr '[:upper:]' '[:lower:]')"
          [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ] || { echo "ERRO: SHA pós-publicação diverge"; exit 1; }
          GITHUB_DIGEST="$(jq -r --arg n "$DEB_NAME" '.assets[] | select(.name==$n) | .digest // ""' <<<"$RELEASE")"
          [ "$GITHUB_DIGEST" = "sha256:$ACTUAL_SHA" ] || { echo "ERRO: digest pós-publicação diverge"; exit 1; }
          rm -f "$API_MANIFEST"
          for attempt in $(seq 1 12); do
            HTTP="$(curl --silent --show-error --output "$API_MANIFEST" --write-out '%{http_code}' --connect-timeout 10 --max-time 30 "$UPDATE_API_BASE/api/v1/updates/latest" || true)"
            if [ "$HTTP" = "200" ] && jq -e . "$API_MANIFEST" >/dev/null 2>&1; then break; fi
            if [ "$attempt" -eq 12 ]; then echo "ERRO: /latest não ficou disponível (HTTP $HTTP)"; exit 1; fi
            sleep 5
          done
          [ "$(jq -r '.version' "$API_MANIFEST")" = "$BUILD_VERSION" ] || { echo "ERRO: /latest retornou versão incorreta"; exit 1; }
          [ "$(jq -r '.assetId' "$API_MANIFEST")" = "$DEB_ID" ] || { echo "ERRO: /latest retornou assetId incorreto"; exit 1; }
          [ "$(jq -r '.assetName' "$API_MANIFEST")" = "$DEB_NAME" ] || { echo "ERRO: /latest retornou assetName incorreto"; exit 1; }
          [ "$(jq -r '.sha256' "$API_MANIFEST" | tr '[:upper:]' '[:lower:]')" = "$ACTUAL_SHA" ] || { echo "ERRO: /latest retornou SHA incorreto"; exit 1; }
          SIGNATURE="$(jq -r '.signature // empty' "$API_MANIFEST")"
          [ -n "$SIGNATURE" ] || { echo "ERRO: /latest não retornou assinatura"; exit 1; }
          timeout 180s curl --fail --silent --show-error --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 150 "$UPDATE_API_BASE/api/v1/updates/asset/$DEB_ID?version=$BUILD_VERSION&sha256=$ACTUAL_SHA" -o "$API_DEB"
          [ "$(sha256sum "$API_DEB" | cut -d' ' -f1 | tr '[:upper:]' '[:lower:]')" = "$ACTUAL_SHA" ] || { echo "ERRO: /asset retornou SHA incorreto"; exit 1; }
          WRONG_SHA="$(printf '0%.0s' {1..64})"
          if [ "$WRONG_SHA" = "$ACTUAL_SHA" ]; then
            WRONG_SHA="$(printf 'f%.0s' {1..64})"
          fi
          API_STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 60 "$UPDATE_API_BASE/api/v1/updates/asset/$DEB_ID?version=$BUILD_VERSION&sha256=$WRONG_SHA")"
          [ "$API_STATUS" = "409" ] || { echo "ERRO: /asset aceitou SHA adulterado (HTTP $API_STATUS)"; exit 1; }
          API_STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 60 "$UPDATE_API_BASE/api/v1/updates/asset/$MANIFEST_ID?version=$BUILD_VERSION&sha256=$ACTUAL_SHA")"
          [ "$API_STATUS" = "404" ] || { echo "ERRO: /asset aceitou assetId do manifesto (HTTP $API_STATUS)"; exit 1; }
          echo "End-to-end release/update smoke test OK: $BUILD_TAG"

      - name: Cleanup failed draft release
        if: failure() && env.RELEASE_ID != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_STATE="$(timeout 30s gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" 2>/dev/null || true)"
          if [ "$(jq -r '.draft // false' <<<"$RELEASE_STATE" 2>/dev/null || echo false)" = "true" ]; then
            timeout 30s gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" || true
            echo "Release draft com falha removida: $RELEASE_ID"
          else
            echo "Release $RELEASE_ID já publicada ou indisponível; não remover no cleanup."
          fi
