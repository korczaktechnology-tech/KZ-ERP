name: Release Linux

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer version to build (for example 0.1.410)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-linux:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: linux-tauri-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'apps/desktop/src-tauri/Cargo.toml') }}
          restore-keys: |
            linux-tauri-${{ runner.os }}-

      - name: Install Linux dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils openssl jq dpkg-dev

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Determine and validate release version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$DISPATCH_VERSION" ]; then
            VERSION="${DISPATCH_VERSION#v}"
          else
            BASE="$(node -p "require('./apps/desktop/package.json').version")"
            if [[ ! "$BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "ERRO: versão base inválida: $BASE"; exit 1; fi
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
            COMMIT_NUMBER="$(git rev-list --count "$GITHUB_SHA")"
            if [ "$COMMIT_NUMBER" -lt 1 ]; then echo "ERRO: não foi possível determinar a posição do commit"; exit 1; fi
            if [ "$COMMIT_NUMBER" -le "$PATCH" ]; then
              LATEST_TAG="$(git tag --list 'v*' --sort=-v:refname | head -n 1 || true)"
              if [ -n "$LATEST_TAG" ]; then
                LATEST_VERSION="${LATEST_TAG#v}"
                if [[ "$LATEST_VERSION" =~ ^$MAJOR\.$MINOR\.[0-9]+$ ]]; then
                  LATEST_PATCH="${LATEST_VERSION##*.}"
                  if [ "$LATEST_PATCH" -ge "$COMMIT_NUMBER" ]; then COMMIT_NUMBER=$((LATEST_PATCH + 1)); fi
                fi
              fi
            fi
            VERSION="$MAJOR.$MINOR.$COMMIT_NUMBER"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERRO: versão inválida: $VERSION"
            exit 1
          fi

          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "ERRO: Release $TAG já existe."
            exit 1
          fi

          LATEST="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName' 2>/dev/null || true)"
          if [ -n "$LATEST" ]; then
            LATEST_VERSION="${LATEST#v}"
            if [[ "$LATEST_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              if ! node -e 'const a=process.argv[1].split(".").map(Number),b=process.argv[2].split(".").map(Number);let c=0;for(let i=0;i<3;i++){if(a[i]!==b[i]){c=a[i]>b[i]?1:-1;break}}if(c<=0)process.exit(1)' "$VERSION" "$LATEST_VERSION"; then
                echo "ERRO: $VERSION não é superior à última release $LATEST_VERSION."
                exit 1
              fi
            fi
          fi

          echo "BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Release desta execução: $TAG"

      - name: Set package version
        working-directory: apps/desktop
        env:
          VERSION: ${{ env.BUILD_VERSION }}
        run: |
          set -euo pipefail
          VERSION="$VERSION" node -e "const fs=require('fs'); for(const f of ['package.json','src-tauri/tauri.conf.json']){const p=JSON.parse(fs.readFileSync(f,'utf8'));p.version=process.env.VERSION;fs.writeFileSync(f,JSON.stringify(p,null,2)+'\\n')}"
          sed -i -E "s/^version = \"[^\"]+\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - name: Prepare update signing key
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$UPDATE_SIGNING_PRIVATE_KEY" ]; then
            echo "ERRO: configure o secret UPDATE_SIGNING_PRIVATE_KEY antes de publicar releases assinadas."
            exit 1
          fi
          printf '%s' "$UPDATE_SIGNING_PRIVATE_KEY" > /tmp/kz-update-signing-key.pem
          PUBLIC_KEY="$(openssl pkey -in /tmp/kz-update-signing-key.pem -pubout -outform DER 2>/dev/null | tail -c 32 | base64 -w0)"
          if [ "${#PUBLIC_KEY}" -ne 44 ]; then echo "ERRO: chave Ed25519 inválida"; exit 1; fi
          echo "UPDATE_PUBLIC_KEY_B64=$PUBLIC_KEY" >> "$GITHUB_ENV"
          rm -f /tmp/kz-update-signing-key.pem

      - name: Generate application icons
        working-directory: apps/desktop
        run: npm run tauri icon src-tauri/icons/icon.svg

      - name: Clean previous Debian bundles
        run: |
          set -euo pipefail
          rm -rf apps/desktop/src-tauri/target/release/bundle/deb
          mkdir -p apps/desktop/src-tauri/target/release/bundle/deb

      - name: Build Linux .deb
        working-directory: apps/desktop
        env:
          VITE_APP_VERSION: ${{ env.BUILD_VERSION }}
          VITE_API_URL: https://kz-erp.onrender.com
          VITE_UPDATE_API_URL: https://kz-erp.onrender.com
          VITE_UPDATE_PUBLIC_KEY_B64: ${{ env.UPDATE_PUBLIC_KEY_B64 }}
        run: npm run tauri build -- --bundles deb

      - name: Verify Debian package
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(apps/desktop/src-tauri/target/release/bundle/deb/*.deb)
          if [ "${#packages[@]}" -ne 1 ]; then echo "ERRO: esperado exatamente 1 arquivo .deb; encontrados ${#packages[@]}"; printf '%s\n' "${packages[@]}"; exit 1; fi
          file "${packages[0]}"
          dpkg-deb --info "${packages[0]}"
          dpkg-deb --contents "${packages[0]}" >/dev/null
          PACKAGE_VERSION="$(dpkg-deb -f "${packages[0]}" Version)"
          if [ "$PACKAGE_VERSION" != "$BUILD_VERSION" ]; then
            echo "ERRO: versão do .deb ($PACKAGE_VERSION) difere de $BUILD_VERSION"
            exit 1
          fi

      - name: Prepare release files
        run: |
          set -euo pipefail
          rm -rf release-artifact
          mkdir -p release-artifact
          cp apps/desktop/src-tauri/target/release/bundle/deb/*.deb release-artifact/KORCZAK-ERP-linux-amd64.deb
          sha256sum release-artifact/KORCZAK-ERP-linux-amd64.deb > release-artifact/SHA256SUMS.txt
          test -s release-artifact/KORCZAK-ERP-linux-amd64.deb
          test -s release-artifact/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KORCZAK-ERP-linux-deb-${{ github.sha }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${BUILD_VERSION}"
          gh release create "$TAG" release-artifact/KORCZAK-ERP-linux-amd64.deb release-artifact/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "KORCZAK ERP $TAG" --notes "Release oficial do KORCZAK ERP para Linux. Criado automaticamente a partir do push $GITHUB_SHA." --draft

      - name: Create signed update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          TAG="v${BUILD_VERSION}"
          ASSET_ID="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name=="KORCZAK-ERP-linux-amd64.deb") | .id')"
          if [[ ! "$ASSET_ID" =~ ^[0-9]+$ ]]; then echo "ERRO: assetId inválido: $ASSET_ID"; exit 1; fi
          SHA256="$(cut -d' ' -f1 release-artifact/SHA256SUMS.txt)"
          printf '%s\n' "${BUILD_VERSION}" "${ASSET_ID}" "${SHA256}" "KORCZAK-ERP-linux-amd64.deb" > release-artifact/update-signing-payload.txt
          printf '%s' "$UPDATE_SIGNING_PRIVATE_KEY" > /tmp/kz-update-signing-key.pem
          openssl pkeyutl -sign -rawin -inkey /tmp/kz-update-signing-key.pem -in release-artifact/update-signing-payload.txt -out release-artifact/signature.bin
          SIGNATURE="$(base64 -w0 release-artifact/signature.bin)"
          printf '{"version":"%s","assetId":%s,"assetName":"%s","sha256":"%s","signature":"%s"}\n' "${BUILD_VERSION}" "${ASSET_ID}" "KORCZAK-ERP-linux-amd64.deb" "${SHA256}" "${SIGNATURE}" > release-artifact/UPDATE-MANIFEST.json
          rm -f /tmp/kz-update-signing-key.pem release-artifact/update-signing-payload.txt release-artifact/signature.bin
          jq -e --arg version "$BUILD_VERSION" --arg sha "$SHA256" '.version==$version and .assetName=="KORCZAK-ERP-linux-amd64.deb" and .sha256==$sha and (.assetId|type)=="number" and (.signature|type)=="string" and (.signature|length)>0' release-artifact/UPDATE-MANIFEST.json >/dev/null
          gh release upload "$TAG" release-artifact/UPDATE-MANIFEST.json --repo "$GITHUB_REPOSITORY" --clobber

      - name: Validate draft release before publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${BUILD_VERSION}"
          ASSETS="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets --jq '[.isDraft, ([.assets[].name] | sort | join("|"))] | @tsv')"
          IS_DRAFT="$(printf '%s' "$ASSETS" | cut -f1)"
          NAMES="$(printf '%s' "$ASSETS" | cut -f2)"
          if [ "$IS_DRAFT" != "true" ]; then echo "ERRO: release deveria continuar como draft nesta etapa."; exit 1; fi
          EXPECTED="KORCZAK-ERP-linux-amd64.deb|SHA256SUMS.txt|UPDATE-MANIFEST.json"
          if [ "$NAMES" != "$EXPECTED" ]; then echo "ERRO: assets da release incompletos: $NAMES"; exit 1; fi

      - name: Publish signed GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${BUILD_VERSION}"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: End-to-end release/update smoke test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_API_URL: https://kz-erp.onrender.com
        run: |
          set -euo pipefail
          TAG="v${BUILD_VERSION}"
          RELEASE_JSON="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets,tagName)")
          echo "$RELEASE_JSON" | jq -e --arg tag "$TAG" '.isDraft==false and .tagName==$tag and ([.assets[].name] | sort) == ["KORCZAK-ERP-linux-amd64.deb","SHA256SUMS.txt","UPDATE-MANIFEST.json"]' >/dev/null

          MANIFEST_URL="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name=="UPDATE-MANIFEST.json") | .url')"
          curl --fail --silent --show-error --location --max-time 30 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$MANIFEST_URL" -o /tmp/update-manifest.json
          jq -e --arg version "$BUILD_VERSION" '.version==$version and .assetName=="KORCZAK-ERP-linux-amd64.deb" and (.assetId|type)=="number" and (.sha256|test("^[0-9a-fA-F]{64}$")) and (.signature|type)=="string" and (.signature|length)>0' /tmp/update-manifest.json >/dev/null

          HTTP_CODE="$(curl --silent --show-error --output /tmp/latest.json --write-out '%{http_code}' --max-time 30 "$UPDATE_API_URL/api/v1/updates/latest")"
          if [ "$HTTP_CODE" != "200" ]; then echo "ERRO: endpoint /updates/latest retornou HTTP $HTTP_CODE"; cat /tmp/latest.json; exit 1; fi
          jq -e --arg version "$BUILD_VERSION" '.version==$version and .assetName=="KORCZAK-ERP-linux-amd64.deb" and (.assetId|type)=="number" and (.sha256|test("^[0-9a-fA-F]{64}$")) and (.signature|type)=="string" and (.signature|length)>0' /tmp/latest.json >/dev/null

          ASSET_URL="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name=="KORCZAK-ERP-linux-amd64.deb") | .url')"
          curl --fail --silent --show-error --location --max-time 180 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$ASSET_URL" -o /tmp/KORCZAK-ERP-linux-amd64.deb
          EXPECTED_SHA="$(jq -r '.sha256' /tmp/update-manifest.json)"
          ACTUAL_SHA="$(sha256sum /tmp/KORCZAK-ERP-linux-amd64.deb | cut -d' ' -f1)"
          if [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then echo "ERRO: SHA256 do .deb não corresponde ao manifesto."; exit 1; fi

          PACKAGE_VERSION="$(dpkg-deb -f /tmp/KORCZAK-ERP-linux-amd64.deb Version)"
          if [ "$PACKAGE_VERSION" != "$BUILD_VERSION" ]; then echo "ERRO: pacote baixado contém versão $PACKAGE_VERSION, esperado $BUILD_VERSION."; exit 1; fi
          echo "E2E smoke test concluído: release publicada, manifesto assinado presente, API retornando metadados e .deb íntegro e versionado corretamente."
