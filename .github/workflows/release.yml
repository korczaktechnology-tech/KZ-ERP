name: Release Linux

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer version to build (for example 0.1.3)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-linux:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: linux-tauri-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'apps/desktop/src-tauri/Cargo.toml') }}
          restore-keys: |
            linux-tauri-${{ runner.os }}-

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils openssl

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Determine release version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$DISPATCH_VERSION" ]; then
            VERSION="${DISPATCH_VERSION#v}"
          else
            BASE="$(node -p "require('./apps/desktop/package.json').version")"
            if [[ ! "$BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "ERRO: versão base inválida: $BASE"; exit 1; fi
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
            COMMIT_NUMBER="$(git rev-list --count "$GITHUB_SHA")"
            if [ "$COMMIT_NUMBER" -lt 1 ]; then echo "ERRO: não foi possível determinar a posição do commit"; exit 1; fi
            if [ "$COMMIT_NUMBER" -le "$PATCH" ]; then
              LATEST_TAG="$(git tag --list 'v*' --sort=-v:refname | head -n 1 || true)"
              if [ -n "$LATEST_TAG" ]; then
                LATEST_VERSION="${LATEST_TAG#v}"
                if [[ "$LATEST_VERSION" =~ ^$MAJOR\.$MINOR\.[0-9]+$ ]]; then
                  LATEST_PATCH="${LATEST_VERSION##*.}"
                  if [ "$LATEST_PATCH" -ge "$COMMIT_NUMBER" ]; then COMMIT_NUMBER=$((LATEST_PATCH + 1)); fi
                fi
              fi
            fi
            VERSION="$MAJOR.$MINOR.$COMMIT_NUMBER"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "ERRO: versão inválida: $VERSION"; exit 1; fi
          echo "BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Release desta execução: v$VERSION"

      - name: Set package version
        working-directory: apps/desktop
        env:
          VERSION: ${{ env.BUILD_VERSION }}
        run: |
          set -euo pipefail
          VERSION="$VERSION" node -e "const fs=require('fs'); for(const f of ['package.json','src-tauri/tauri.conf.json']){const p=JSON.parse(fs.readFileSync(f,'utf8'));p.version=process.env.VERSION;fs.writeFileSync(f,JSON.stringify(p,null,2)+'\\n')}"
          sed -i -E "s/^version = \"[^\"]+\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - name: Prepare update signing key
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$UPDATE_SIGNING_PRIVATE_KEY" ]; then
            echo "ERRO: configure o secret UPDATE_SIGNING_PRIVATE_KEY antes de publicar releases assinadas."
            exit 1
          fi
          printf '%s' "$UPDATE_SIGNING_PRIVATE_KEY" > /tmp/kz-update-signing-key.pem
          PUBLIC_KEY="$(openssl pkey -in /tmp/kz-update-signing-key.pem -pubout -outform DER 2>/dev/null | tail -c 32 | base64 -w0)"
          if [ "${#PUBLIC_KEY}" -ne 44 ]; then echo "ERRO: chave Ed25519 inválida"; exit 1; fi
          echo "UPDATE_PUBLIC_KEY_B64=$PUBLIC_KEY" >> "$GITHUB_ENV"
          rm -f /tmp/kz-update-signing-key.pem

      - name: Generate application icons
        working-directory: apps/desktop
        run: npm run tauri icon src-tauri/icons/icon.svg

      - name: Clean previous Debian bundles
        run: |
          set -euo pipefail
          rm -rf apps/desktop/src-tauri/target/release/bundle/deb
          mkdir -p apps/desktop/src-tauri/target/release/bundle/deb

      - name: Build Linux .deb
        working-directory: apps/desktop
        env:
          VITE_APP_VERSION: ${{ env.BUILD_VERSION }}
          VITE_API_URL: https://kz-erp.onrender.com
          VITE_UPDATE_API_URL: https://kz-erp.onrender.com
        run: npm run tauri build -- --bundles deb

      - name: Verify Debian package
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(apps/desktop/src-tauri/target/release/bundle/deb/*.deb)
          if [ "${#packages[@]}" -ne 1 ]; then echo "ERRO: esperado exatamente 1 arquivo .deb; encontrados ${#packages[@]}"; printf '%s\n' "${packages[@]}"; exit 1; fi
          file "${packages[0]}"
          dpkg-deb --info "${packages[0]}"
          dpkg-deb --contents "${packages[0]}" >/dev/null

      - name: Prepare release files
        run: |
          set -euo pipefail
          rm -rf release-artifact
          mkdir -p release-artifact
          cp apps/desktop/src-tauri/target/release/bundle/deb/*.deb release-artifact/KORCZAK-ERP-linux-amd64.deb
          sha256sum release-artifact/KORCZAK-ERP-linux-amd64.deb > release-artifact/SHA256SUMS.txt
          test -s release-artifact/KORCZAK-ERP-linux-amd64.deb
          test -s release-artifact/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KORCZAK-ERP-linux-deb-${{ github.sha }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${BUILD_VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "ERRO: Release $TAG já existe. Isso indica colisão de versão."
            exit 1
          fi
          gh release create "$TAG" release-artifact/KORCZAK-ERP-linux-amd64.deb release-artifact/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "KORCZAK ERP $TAG" --notes "Release oficial do KORCZAK ERP para Linux. Criado automaticamente a partir do push $GITHUB_SHA."

      - name: Create signed update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          ASSET_ID="$(gh release view "v${BUILD_VERSION}" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name=="KORCZAK-ERP-linux-amd64.deb") | .id')"
          SHA256="$(cut -d' ' -f1 release-artifact/SHA256SUMS.txt)"
          printf '%s\n' "${BUILD_VERSION}" "${ASSET_ID}" "${SHA256}" "KORCZAK-ERP-linux-amd64.deb" > release-artifact/update-signing-payload.txt
          printf '%s' "$UPDATE_SIGNING_PRIVATE_KEY" > /tmp/kz-update-signing-key.pem
          openssl pkeyutl -sign -rawin -inkey /tmp/kz-update-signing-key.pem -in release-artifact/update-signing-payload.txt -out release-artifact/signature.bin
          SIGNATURE="$(base64 -w0 release-artifact/signature.bin)"
          printf '{"version":"%s","assetId":%s,"assetName":"%s","sha256":"%s","signature":"%s"}\n' "${BUILD_VERSION}" "${ASSET_ID}" "KORCZAK-ERP-linux-amd64.deb" "${SHA256}" "${SIGNATURE}" > release-artifact/UPDATE-MANIFEST.json
          rm -f /tmp/kz-update-signing-key.pem release-artifact/update-signing-payload.txt release-artifact/signature.bin
          gh release upload "v${BUILD_VERSION}" release-artifact/UPDATE-MANIFEST.json --repo "$GITHUB_REPOSITORY" --clobber
