name: Release Linux

on:
  push:
    branches: [main]
    paths:
      - .github/release-trigger
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer version to build (for example 0.1.3)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: linux-tauri-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'apps/desktop/src-tauri/Cargo.toml') }}
          restore-keys: |
            linux-tauri-${{ runner.os }}-

      - name: Install Linux dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils openssl jq dpkg-dev curl

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Determine release version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$DISPATCH_VERSION" ]; then
            VERSION="${DISPATCH_VERSION#v}"
          else
            BASE="$(node -p "require('./apps/desktop/package.json').version")"
            [[ "$BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "ERRO: versão base inválida"; exit 1; }
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
            COUNT="$(git rev-list --count "$GITHUB_SHA")"
            [ "$COUNT" -gt "$PATCH" ] || COUNT=$((PATCH + 1))
            VERSION="$MAJOR.$MINOR.$COUNT"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "ERRO: versão inválida: $VERSION"; exit 1; }
          TAG="v$VERSION"
          echo "BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_TAG=$TAG" >> "$GITHUB_ENV"
          EXISTING="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name=="'"$TAG"'") | [.id,.draft] | @tsv' | head -n1 || true)"
          if [ -n "$EXISTING" ]; then
            read -r EXISTING_ID EXISTING_DRAFT <<< "$EXISTING"
            if [ "$EXISTING_DRAFT" = "true" ]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$EXISTING_ID"
            else
              echo "ERRO: a release $TAG já está publicada."
              exit 1
            fi
          fi
          LATEST="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft==false and .prerelease==false) | .tag_name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          if [ -n "$LATEST" ]; then
            LATEST_VERSION="${LATEST#v}"
            node -e 'const a=process.argv[1].split(".").map(Number),b=process.argv[2].split(".").map(Number);for(let i=0;i<3;i++){if(a[i]>b[i])process.exit(0);if(a[i]<b[i])process.exit(1)}process.exit(1)' "$VERSION" "$LATEST_VERSION"
          fi

      - name: Set package version
        working-directory: apps/desktop
        env:
          VERSION: ${{ env.BUILD_VERSION }}
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs"),v=process.env.VERSION;for(const f of ["package.json","src-tauri/tauri.conf.json"]){const d=JSON.parse(fs.readFileSync(f,"utf8"));d.version=v;fs.writeFileSync(f,JSON.stringify(d,null,2)+"\n")}'
          sed -i -E "s/^version = \"[^\"]+\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - name: Prepare update signing key
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [ -n "$UPDATE_SIGNING_PRIVATE_KEY" ] || { echo "ERRO: configure UPDATE_SIGNING_PRIVATE_KEY."; exit 1; }
          printf '%s' "$UPDATE_SIGNING_PRIVATE_KEY" >/tmp/kz-update-signing-key.pem
          PUBLIC_KEY="$(openssl pkey -in /tmp/kz-update-signing-key.pem -pubout -outform DER 2>/dev/null | tail -c 32 | base64 -w0)"
          [ "${#PUBLIC_KEY}" -eq 44 ] || { echo "ERRO: chave Ed25519 inválida."; exit 1; }
          echo "UPDATE_PUBLIC_KEY_B64=$PUBLIC_KEY" >> "$GITHUB_ENV"
          rm -f /tmp/kz-update-signing-key.pem

      - name: Generate application icons
        working-directory: apps/desktop
        run: npm run tauri icon src-tauri/icons/icon.svg

      - name: Clean previous Debian bundles
        run: rm -rf apps/desktop/src-tauri/target/release/bundle/deb

      - name: Build Linux .deb
        working-directory: apps/desktop
        env:
          VITE_APP_VERSION: ${{ env.BUILD_VERSION }}
          VITE_API_URL: https://kz-erp.onrender.com
          VITE_UPDATE_API_URL: https://kz-erp.onrender.com
          VITE_UPDATE_PUBLIC_KEY_B64: ${{ env.UPDATE_PUBLIC_KEY_B64 }}
        run: npm run tauri build -- --bundles deb

      - name: Verify Debian package
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(apps/desktop/src-tauri/target/release/bundle/deb/*.deb)
          [ "${#packages[@]}" -eq 1 ] || { echo "ERRO: esperado exatamente 1 .deb"; exit 1; }
          PACKAGE="${packages[0]}"
          dpkg-deb --info "$PACKAGE"
          dpkg-deb --contents "$PACKAGE" >/dev/null
          [ "$(dpkg-deb -f "$PACKAGE" Version)" = "$BUILD_VERSION" ] || { echo "ERRO: versão do .deb incorreta"; exit 1; }

      - name: Prepare release files
        run: |
          set -euo pipefail
          rm -rf release-artifact && mkdir -p release-artifact
          cp apps/desktop/src-tauri/target/release/bundle/deb/*.deb "release-artifact/$DEB_NAME"
          sha256sum "release-artifact/$DEB_NAME" > release-artifact/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KORCZAK-ERP-linux-deb-${{ github.sha }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Create draft release and upload base assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${BUILD_VERSION}"
          RELEASE_JSON="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f name="KORCZAK ERP $TAG" -f body="Release oficial do KORCZAK ERP. Commit $GITHUB_SHA." -F draft=true -F prerelease=false)"
          RELEASE_ID="$(jq -r '.id' <<<"$RELEASE_JSON")"
          UPLOAD_URL="$(jq -r '.upload_url' <<<"$RELEASE_JSON" | sed 's/{?name,label}//')"
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]] || { echo "ERRO: release ID inválido: $RELEASE_ID"; exit 1; }
          [[ "$UPLOAD_URL" == https://uploads.github.com/repos/*/releases/*/assets ]] || { echo "ERRO: upload_url inválida"; exit 1; }
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          echo "RELEASE_UPLOAD_URL=$UPLOAD_URL" >> "$GITHUB_ENV"
          curl --fail-with-body --retry 3 --retry-delay 2 -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2026-03-10" -H "Content-Type: application/octet-stream" --data-binary @"release-artifact/$DEB_NAME" "$UPLOAD_URL?name=$DEB_NAME" >/dev/null
          curl --fail-with-body --retry 3 --retry-delay 2 -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2026-03-10" -H "Content-Type: text/plain" --data-binary @release-artifact/SHA256SUMS.txt "$UPLOAD_URL?name=SHA256SUMS.txt" >/dev/null

      - name: Create signed update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          SHA256="$(cut -d' ' -f1 release-artifact/SHA256SUMS.txt)"
          [[ "$SHA256" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "ERRO: SHA256 inválido"; exit 1; }
          ASSET_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" --jq '.[] | select(.name=="'"$DEB_NAME"'") | .id')"
          [[ "$ASSET_ID" =~ ^[0-9]+$ ]] || { echo "ERRO: assetId REST inválido: $ASSET_ID"; exit 1; }
          printf '%s\n%s\n%s\n%s\n' "$BUILD_VERSION" "$ASSET_ID" "$SHA256" "$DEB_NAME" > release-artifact/update-signing-payload.txt
          printf '%s' "$UPDATE_SIGNING_PRIVATE_KEY" >/tmp/kz-update-signing-key.pem
          openssl pkeyutl -sign -rawin -inkey /tmp/kz-update-signing-key.pem -in release-artifact/update-signing-payload.txt -out release-artifact/signature.bin
          SIGNATURE="$(base64 -w0 release-artifact/signature.bin)"
          printf '{"version":"%s","assetId":%s,"assetName":"%s","sha256":"%s","signature":"%s"}\n' "$BUILD_VERSION" "$ASSET_ID" "$DEB_NAME" "$SHA256" "$SIGNATURE" > release-artifact/UPDATE-MANIFEST.json
          rm -f /tmp/kz-update-signing-key.pem release-artifact/update-signing-payload.txt release-artifact/signature.bin
          curl --fail-with-body --retry 3 --retry-delay 2 -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2026-03-10" -H "Content-Type: application/json" --data-binary @release-artifact/UPDATE-MANIFEST.json "$RELEASE_UPLOAD_URL?name=UPDATE-MANIFEST.json" >/dev/null

      - name: Validate draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          [ "$(jq -r '.draft' <<<"$RELEASE")" = "true" ] || { echo "ERRO: release não está em draft"; exit 1; }
          for NAME in "$DEB_NAME" SHA256SUMS.txt UPDATE-MANIFEST.json; do
            jq -e --arg n "$NAME" '.assets[] | select(.name==$n and .state=="uploaded")' <<<"$RELEASE" >/dev/null || { echo "ERRO: asset ausente: $NAME"; exit 1; }
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PUBLISHED="$(gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false)"
          [ "$(jq -r '.draft' <<<"$PUBLISHED")" = "false" ] || { echo "ERRO: release não foi publicada"; exit 1; }

      - name: End-to-end release/update smoke test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          [ "$(jq -r '.draft' <<<"$RELEASE")" = "false" ] || { echo "ERRO: release ainda draft"; exit 1; }
          MANIFEST_URL="$(jq -r '.assets[] | select(.name=="UPDATE-MANIFEST.json") | .browser_download_url' <<<"$RELEASE")"
          DEB_URL="$(jq -r '.assets[] | select(.name=="'"$DEB_NAME"'") | .browser_download_url' <<<"$RELEASE")"
          [ -n "$MANIFEST_URL" ] && [ "$MANIFEST_URL" != "null" ] || { echo "ERRO: URL do manifesto ausente"; exit 1; }
          [ -n "$DEB_URL" ] && [ "$DEB_URL" != "null" ] || { echo "ERRO: URL do .deb ausente"; exit 1; }
          curl --fail -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$MANIFEST_URL" -o /tmp/UPDATE-MANIFEST.json
          curl --fail -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$DEB_URL" -o /tmp/KORCZAK-ERP-linux-amd64.deb
          jq -e --arg v "$BUILD_VERSION" --arg n "$DEB_NAME" '.version==$v and .assetName==$n and (.assetId|type=="number") and (.sha256|test("^[0-9a-fA-F]{64}$")) and (.signature|length>0)' /tmp/UPDATE-MANIFEST.json >/dev/null
          echo "Release/update smoke test OK: $BUILD_TAG"

      - name: Cleanup failed draft release
        if: failure() && env.RELEASE_ID != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          if [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" || true
          fi
