name: Release Linux

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install
      - name: Set release version
        working-directory: apps/desktop
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          node -e "const fs=require('fs'); for(const f of ['package.json','src-tauri/tauri.conf.json']){const p=JSON.parse(fs.readFileSync(f));p.version=process.env.RELEASE_VERSION.replace(/^v/,'');fs.writeFileSync(f,JSON.stringify(p,null,2)+'\\n')}"
          sed -i -E "s/^version = \"[^"]+\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
      - name: Generate application icons
        working-directory: apps/desktop
        run: npm run tauri icon src-tauri/icons/icon.svg
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_APP_VERSION: ${{ github.ref_name }}
          VITE_API_URL: https://kz-erp-api.onrender.com
          VITE_UPDATE_API_URL: https://kz-erp-api.onrender.com
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'KORCZAK ERP ${{ github.ref_name }}'
          releaseBody: 'Release oficial do KORCZAK ERP para Linux.'
          releaseDraft: false
          prerelease: false
          args: --bundles deb
      - name: Generate checksums
        run: |
          mkdir -p release-checksums
          sha256sum apps/desktop/src-tauri/target/release/bundle/deb/*.deb > release-checksums/SHA256SUMS.txt
      - name: Upload checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" release-checksums/SHA256SUMS.txt --clobber
