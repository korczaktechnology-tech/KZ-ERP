name: Release Linux

on:
  push:
    branches: [main]
    paths:
      - .github/release-trigger
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer version to build (for example 0.1.3)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: linux-release
  cancel-in-progress: false

env:
  DEB_NAME: KORCZAK-ERP-linux-amd64.deb
  MAX_DEB_BYTES: 262144000

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: linux-tauri-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'apps/desktop/src-tauri/Cargo.toml') }}
          restore-keys: |
            linux-tauri-${{ runner.os }}-

      - name: Install Linux dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils openssl jq dpkg-dev curl coreutils

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Determine release version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$DISPATCH_VERSION" ]; then
            VERSION="${DISPATCH_VERSION#v}"
          else
            BASE="$(node -p "require('./apps/desktop/package.json').version")"
            [[ "$BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "ERRO: versão base inválida"; exit 1; }
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
            COUNT="$(git rev-list --count "$GITHUB_SHA")"
            [ "$COUNT" -gt "$PATCH" ] || COUNT=$((PATCH + 1))
            VERSION="$MAJOR.$MINOR.$COUNT"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "ERRO: versão inválida: $VERSION"; exit 1; }
          TAG="v$VERSION"
          echo "BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_TAG=$TAG" >> "$GITHUB_ENV"
          EXISTING="$(timeout 30s gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name=="'"$TAG"'") | [.id,.draft] | @tsv' | head -n1 || true)"
          if [ -n "$EXISTING" ]; then
            read -r EXISTING_ID EXISTING_DRAFT <<< "$EXISTING"
            if [ "$EXISTING_DRAFT" = "true" ]; then
              timeout 30s gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$EXISTING_ID"
            else
              echo "ERRO: a release $TAG já está publicada."
              exit 1
            fi
          fi
          LATEST="$(timeout 30s gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft==false and .prerelease==false) | .tag_name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          if [ -n "$LATEST" ]; then
            LATEST_VERSION="${LATEST#v}"
            node -e 'const a=process.argv[1].split(".").map(Number),b=process.argv[2].split(".").map(Number);for(let i=0;i<3;i++){if(a[i]>b[i])process.exit(0);if(a[i]<b[i])process.exit(1)}process.exit(1)' "$VERSION" "$LATEST_VERSION" || { echo "ERRO: versão $VERSION não é superior à última release $LATEST_VERSION"; exit 1; }
          fi

      - name: Set package version
        working-directory: apps/desktop
        env:
          VERSION: ${{ env.BUILD_VERSION }}
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs"),v=process.env.VERSION;for(const f of ["package.json","src-tauri/tauri.conf.json"]){const d=JSON.parse(fs.readFileSync(f,"utf8"));d.version=v;fs.writeFileSync(f,JSON.stringify(d,null,2)+"\n")}'
          sed -i -E "s/^version = \"[^\"]+\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          [ "$(node -p "require('./package.json').version")" = "$VERSION" ]
          [ "$(node -p "require('./src-tauri/tauri.conf.json').version")" = "$VERSION" ]
          grep -q '^version = "' src-tauri/Cargo.toml

      - name: Prepare update signing key
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [ -n "$UPDATE_SIGNING_PRIVATE_KEY" ] || { echo "ERRO: configure UPDATE_SIGNING_PRIVATE_KEY."; exit 1; }
          printf '%s' "$UPDATE_SIGNING_PRIVATE_KEY" >/tmp/kz-update-signing-key.pem
          timeout 30s openssl pkey -in /tmp/kz-update-signing-key.pem -pubout -out /tmp/kz-update-public-key.pem
          PUBLIC_KEY="$(timeout 30s openssl pkey -in /tmp/kz-update-signing-key.pem -pubout -outform DER | tail -c 32 | base64 -w0)"
          [ "${#PUBLIC_KEY}" -eq 44 ] || { echo "ERRO: chave Ed25519 inválida."; exit 1; }
          echo "UPDATE_PUBLIC_KEY_B64=$PUBLIC_KEY" >> "$GITHUB_ENV"
          rm -f /tmp/kz-update-signing-key.pem /tmp/kz-update-public-key.pem

      - name: Generate application icons
        working-directory: apps/desktop
        run: npm run tauri icon src-tauri/icons/icon.svg

      - name: Clean previous Debian bundles
        run: rm -rf apps/desktop/src-tauri/target/release/bundle/deb

      - name: Build Linux .deb
        working-directory: apps/desktop
        env:
          VITE_APP_VERSION: ${{ env.BUILD_VERSION }}
          VITE_API_URL: https://kz-erp.onrender.com
          VITE_UPDATE_API_URL: https://kz-erp.onrender.com
          VITE_UPDATE_PUBLIC_KEY_B64: ${{ env.UPDATE_PUBLIC_KEY_B64 }}
        run: npm run tauri build -- --bundles deb

      - name: Verify Debian package
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(apps/desktop/src-tauri/target/release/bundle/deb/*.deb)
          [ "${#packages[@]}" -eq 1 ] || { echo "ERRO: esperado exatamente 1 .deb"; exit 1; }
          PACKAGE="${packages[0]}"
          SIZE="$(stat -c '%s' "$PACKAGE")"
          [ "$SIZE" -gt 0 ] && [ "$SIZE" -le "$MAX_DEB_BYTES" ] || { echo "ERRO: tamanho do .deb inválido: $SIZE bytes"; exit 1; }
          dpkg-deb --info "$PACKAGE"
          dpkg-deb --contents "$PACKAGE" >/dev/null
          [ "$(dpkg-deb -f "$PACKAGE" Version)" = "$BUILD_VERSION" ] || { echo "ERRO: versão do .deb incorreta"; exit 1; }
          [ "$(dpkg-deb -f "$PACKAGE" Architecture)" = "amd64" ] || { echo "ERRO: arquitetura do .deb incorreta"; exit 1; }

      - name: Prepare release files
        run: |
          set -euo pipefail
          rm -rf release-artifact && mkdir -p release-artifact
          cp apps/desktop/src-tauri/target/release/bundle/deb/*.deb "release-artifact/$DEB_NAME"
          sha256sum "release-artifact/$DEB_NAME" > release-artifact/SHA256SUMS.txt
          test -s "release-artifact/$DEB_NAME"
          test -s release-artifact/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KORCZAK-ERP-linux-deb-${{ github.sha }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Create draft release and upload base assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${BUILD_VERSION}"
          RELEASE_JSON="$(timeout 30s gh api --method POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f name="KORCZAK ERP $TAG" -f body="Release oficial do KORCZAK ERP. Commit $GITHUB_SHA." -F draft=true -F prerelease=false)"
          RELEASE_ID="$(jq -r '.id' <<<"$RELEASE_JSON")"
          UPLOAD_URL="$(jq -r '.upload_url' <<<"$RELEASE_JSON" | sed 's/{?name,label}//')"
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]] || { echo "ERRO: release ID inválido: $RELEASE_ID"; exit 1; }
          [[ "$UPLOAD_URL" == https://uploads.github.com/repos/*/releases/*/assets ]] || { echo "ERRO: upload_url inválida"; exit 1; }
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          echo "RELEASE_UPLOAD_URL=$UPLOAD_URL" >> "$GITHUB_ENV"
          timeout 150s curl --fail-with-body --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 120 -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2026-03-10" -H "Content-Type: application/octet-stream" --data-binary @"release-artifact/$DEB_NAME" "$UPLOAD_URL?name=$DEB_NAME" >/dev/null
          timeout 90s curl --fail-with-body --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 60 -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2026-03-10" -H "Content-Type: text/plain" --data-binary @release-artifact/SHA256SUMS.txt "$UPLOAD_URL?name=SHA256SUMS.txt" >/dev/null

      - name: Create signed update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          SHA256="$(cut -d' ' -f1 release-artifact/SHA256SUMS.txt | tr '[:upper:]' '[:lower:]')"
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "ERRO: SHA256 inválido"; exit 1; }
          ASSET_ID="$(timeout 30s gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" --jq '.[] | select(.name=="'"$DEB_NAME"'" and .state=="uploaded") | .id')"
          [[ "$ASSET_ID" =~ ^[0-9]+$ ]] || { echo "ERRO: assetId REST inválido: $ASSET_ID"; exit 1; }
          printf '%s\n%s\n%s\n%s\n' "$BUILD_VERSION" "$ASSET_ID" "$SHA256" "$DEB_NAME" > release-artifact/update-signing-payload.txt
          printf '%s' "$UPDATE_SIGNING_PRIVATE_KEY" >/tmp/kz-update-signing-key.pem
          timeout 30s openssl pkeyutl -sign -rawin -inkey /tmp/kz-update-signing-key.pem -in release-artifact/update-signing-payload.txt -out release-artifact/signature.bin
          SIGNATURE="$(base64 -w0 release-artifact/signature.bin)"
          printf '{"version":"%s","assetId":%s,"assetName":"%s","sha256":"%s","signature":"%s"}\n' "$BUILD_VERSION" "$ASSET_ID" "$DEB_NAME" "$SHA256" "$SIGNATURE" > release-artifact/UPDATE-MANIFEST.json
          jq -e --arg v "$BUILD_VERSION" --arg n "$DEB_NAME" '.version==$v and .assetId==('$ASSET_ID') and .assetName==$n and (.sha256|test("^[0-9a-f]{64}$")) and (.signature|length>0)' release-artifact/UPDATE-MANIFEST.json >/dev/null
          rm -f /tmp/kz-update-signing-key.pem
          timeout 90s curl --fail-with-body --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 60 -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2026-03-10" -H "Content-Type: application/json" --data-binary @release-artifact/UPDATE-MANIFEST.json "$RELEASE_UPLOAD_URL?name=UPDATE-MANIFEST.json" >/dev/null

      - name: Validate draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE="$(timeout 30s gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          [ "$(jq -r '.draft' <<<"$RELEASE")" = "true" ] || { echo "ERRO: release não está em draft"; exit 1; }
          [ "$(jq -r '.tag_name' <<<"$RELEASE")" = "$BUILD_TAG" ] || { echo "ERRO: tag incorreta"; exit 1; }
          [ "$(jq -r '.target_commitish' <<<"$RELEASE")" = "$GITHUB_SHA" ] || { echo "ERRO: commit alvo incorreto"; exit 1; }
          for NAME in "$DEB_NAME" SHA256SUMS.txt UPDATE-MANIFEST.json; do
            jq -e --arg n "$NAME" '.assets[] | select(.name==$n and .state=="uploaded" and (.size|tonumber)>0)' <<<"$RELEASE" >/dev/null || { echo "ERRO: asset ausente ou vazio: $NAME"; exit 1; }
          done
          DEB_ID="$(jq -r --arg n "$DEB_NAME" '.assets[] | select(.name==$n) | .id' <<<"$RELEASE")"
          MANIFEST_ID="$(jq -r '.assets[] | select(.name=="UPDATE-MANIFEST.json") | .id' <<<"$RELEASE")"
          [ "$(jq -r --arg n "$DEB_NAME" '.assets[] | select(.name==$n) | .digest // ""' <<<"$RELEASE")" != "" ] || { echo "ERRO: digest do .deb ausente"; exit 1; }
          [[ "$DEB_ID" =~ ^[0-9]+$ ]] && [[ "$MANIFEST_ID" =~ ^[0-9]+$ ]]

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PUBLISHED="$(timeout 30s gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false)"
          [ "$(jq -r '.draft' <<<"$PUBLISHED")" = "false" ] || { echo "ERRO: release não foi publicada"; exit 1; }
          [ "$(jq -r '.tag_name' <<<"$PUBLISHED")" = "$BUILD_TAG" ] || { echo "ERRO: tag publicada incorreta"; exit 1; }

      - name: End-to-end release/update smoke test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          RELEASE="$(timeout 30s gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          [ "$(jq -r '.draft' <<<"$RELEASE")" = "false" ] || { echo "ERRO: release ainda draft"; exit 1; }
          [ "$(jq -r '.tag_name' <<<"$RELEASE")" = "$BUILD_TAG" ] || { echo "ERRO: tag do release diverge"; exit 1; }
          MANIFEST_ASSET_ID="$(jq -r '.assets[] | select(.name=="UPDATE-MANIFEST.json" and .state=="uploaded") | .id' <<<"$RELEASE")"
          DEB_ASSET_ID="$(jq -r --arg n "$DEB_NAME" '.assets[] | select(.name==$n and .state=="uploaded") | .id' <<<"$RELEASE")"
          [[ "$MANIFEST_ASSET_ID" =~ ^[0-9]+$ ]] || { echo "ERRO: assetId do manifesto inválido"; exit 1; }
          [[ "$DEB_ASSET_ID" =~ ^[0-9]+$ ]] || { echo "ERRO: assetId do .deb inválido"; exit 1; }
          timeout 60s gh api "repos/$GITHUB_REPOSITORY/releases/assets/$MANIFEST_ASSET_ID" -H "Accept: application/octet-stream" --output /tmp/UPDATE-MANIFEST.json
          timeout 150s gh api "repos/$GITHUB_REPOSITORY/releases/assets/$DEB_ASSET_ID" -H "Accept: application/octet-stream" --output /tmp/KORCZAK-ERP-linux-amd64.deb
          test -s /tmp/UPDATE-MANIFEST.json
          test -s /tmp/KORCZAK-ERP-linux-amd64.deb
          DOWNLOADED_SIZE="$(stat -c '%s' /tmp/KORCZAK-ERP-linux-amd64.deb)"
          [ "$DOWNLOADED_SIZE" -le "$MAX_DEB_BYTES" ] || { echo "ERRO: .deb baixado excede limite"; exit 1; }
          jq -e --arg v "$BUILD_VERSION" --arg n "$DEB_NAME" '.version==$v and .assetName==$n and (.assetId|type=="number") and (.sha256|test("^[0-9a-fA-F]{64}$")) and (.signature|length>0)' /tmp/UPDATE-MANIFEST.json >/dev/null
          MANIFEST_ASSET_ID_JSON="$(jq -r '.assetId' /tmp/UPDATE-MANIFEST.json)"
          [ "$MANIFEST_ASSET_ID_JSON" = "$DEB_ASSET_ID" ] || { echo "ERRO: assetId do manifesto não corresponde ao asset publicado"; exit 1; }
          EXPECTED_SHA="$(jq -r '.sha256' /tmp/UPDATE-MANIFEST.json | tr '[:upper:]' '[:lower:]')"
          ACTUAL_SHA="$(sha256sum /tmp/KORCZAK-ERP-linux-amd64.deb | cut -d' ' -f1 | tr '[:upper:]' '[:lower:]')"
          [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ] || { echo "ERRO: SHA256 baixado diverge do manifesto"; exit 1; }
          GITHUB_DIGEST="$(jq -r --arg n "$DEB_NAME" '.assets[] | select(.name==$n) | .digest // ""' <<<"$RELEASE")"
          [ "$GITHUB_DIGEST" = "sha256:$ACTUAL_SHA" ] || { echo "ERRO: digest do GitHub diverge do SHA256 real"; exit 1; }
          printf '%s\n%s\n%s\n%s\n' "$BUILD_VERSION" "$DEB_ASSET_ID" "$ACTUAL_SHA" "$DEB_NAME" >/tmp/update-signing-payload.txt
          printf '%s' "$UPDATE_SIGNING_PRIVATE_KEY" >/tmp/kz-update-signing-key.pem
          timeout 30s openssl pkey -in /tmp/kz-update-signing-key.pem -pubout -out /tmp/kz-update-public-key.pem
          jq -r '.signature' /tmp/UPDATE-MANIFEST.json | base64 -d >/tmp/update-signature.bin
          timeout 30s openssl pkeyutl -verify -rawin -pubin -inkey /tmp/kz-update-public-key.pem -in /tmp/update-signing-payload.txt -sigfile /tmp/update-signature.bin >/dev/null
          rm -f /tmp/kz-update-signing-key.pem /tmp/kz-update-public-key.pem /tmp/update-signing-payload.txt /tmp/update-signature.bin /tmp/UPDATE-MANIFEST.json /tmp/KORCZAK-ERP-linux-amd64.deb
          echo "Release/update smoke test OK: $BUILD_TAG"

      - name: Cleanup failed draft release
        if: failure() && env.RELEASE_ID != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_STATE="$(timeout 30s gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" 2>/dev/null || true)"
          if [ "$(jq -r '.draft // false' <<<"$RELEASE_STATE" 2>/dev/null || echo false)" = "true" ]; then
            timeout 30s gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" || true
            echo "Release draft com falha removida: $RELEASE_ID"
          else
            echo "Release $RELEASE_ID já publicada ou indisponível; não remover no cleanup."
          fi
