name: Release Linux

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer version to build (for example 0.1.2)'
        required: true
        default: '0.1.2'
        type: string

permissions:
  contents: write

concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: linux-tauri-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'apps/desktop/src-tauri/Cargo.toml') }}
          restore-keys: |
            linux-tauri-${{ runner.os }}-

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Set package version
        working-directory: apps/desktop
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_VERSION" ]; then
            VERSION="${RELEASE_VERSION#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERRO: versão inválida: $VERSION"
            echo "Use SemVer no formato X.Y.Z, por exemplo 0.1.2."
            exit 1
          fi
          VERSION="$VERSION" node -e "const fs=require('fs'); for(const f of ['package.json','src-tauri/tauri.conf.json']){const p=JSON.parse(fs.readFileSync(f,'utf8'));p.version=process.env.VERSION;fs.writeFileSync(f,JSON.stringify(p,null,2)+'\\n')}"
          sed -i -E "s/^version = \"[^\"]+\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          echo "BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Generate application icons
        working-directory: apps/desktop
        run: npm run tauri icon src-tauri/icons/icon.svg

      - name: Build Linux .deb
        working-directory: apps/desktop
        env:
          VITE_APP_VERSION: ${{ env.BUILD_VERSION }}
          VITE_API_URL: https://kz-erp.onrender.com
          VITE_UPDATE_API_URL: https://kz-erp.onrender.com
        run: npm run tauri build -- --bundles deb

      - name: Verify Debian package
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(apps/desktop/src-tauri/target/release/bundle/deb/*.deb)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "ERRO: esperado exatamente 1 arquivo .deb; encontrados ${#packages[@]}"
            printf '%s\n' "${packages[@]}"
            exit 1
          fi
          file "${packages[0]}"
          dpkg-deb --info "${packages[0]}"
          dpkg-deb --contents "${packages[0]}" >/dev/null

      - name: Prepare release files
        run: |
          set -euo pipefail
          rm -rf release-artifact
          mkdir -p release-artifact
          cp apps/desktop/src-tauri/target/release/bundle/deb/*.deb release-artifact/KORCZAK-ERP-linux-amd64.deb
          sha256sum release-artifact/KORCZAK-ERP-linux-amd64.deb > release-artifact/SHA256SUMS.txt
          test -s release-artifact/KORCZAK-ERP-linux-amd64.deb
          test -s release-artifact/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KORCZAK-ERP-linux-deb-${{ github.sha }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" \
            release-artifact/KORCZAK-ERP-linux-amd64.deb \
            release-artifact/SHA256SUMS.txt \
            --title "KORCZAK ERP ${{ github.ref_name }}" \
            --notes "Release oficial do KORCZAK ERP para Linux."
